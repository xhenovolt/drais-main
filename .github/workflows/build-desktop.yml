name: Build Desktop

# Cross-platform desktop release pipeline for DRAIS (Electron + electron-builder).
# Produces Windows (NSIS + portable), Linux (AppImage + deb) and macOS (dmg + zip)
# artifacts and attaches them to a single DRAFT GitHub Release.
#
# Triggers:
#   - pushing a tag like v1.48.0   → builds + drafts a release
#   - manual run (workflow_dispatch) → builds + uploads artifacts (no release
#     unless run on a tag)
#
# Builds are UNSIGNED for now (see docs/BUILD_PIPELINE.md for signing TODOs).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write          # needed for softprops/action-gh-release

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false      # one OS failing must not abort the others
      matrix:
        include:
          # Windows first — highest priority.
          - os: windows-latest
            platform: windows
            flags: --win --x64
          - os: ubuntu-latest
            platform: linux
            flags: --linux AppImage deb
          - os: macos-latest
            platform: macos
            flags: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'   # matches package.json engines (24.x)
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next standalone + electron postbuild
        run: npm run build:electron
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Package with electron-builder (unsigned)
        run: npx electron-builder ${{ matrix.flags }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS: do not attempt to discover/sign with a Developer ID we don't
          # have. Remove this once signing secrets are configured.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: drais-${{ matrix.platform }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.dmg
            dist/*.zip
            dist/*.snap
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Publish GitHub Release (draft)
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish draft release with all artifacts
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
