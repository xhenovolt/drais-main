name: Build Android (debug APK)

# EXPERIMENTAL. DRAIS Android = Capacitor + nodejs-mobile (a real Node runtime
# inside the APK running the Next standalone server on 127.0.0.1:3210). The base
# exists in-repo (android/, capacitor.config.ts, scripts/build-mobile.mjs), so
# this is a genuine build — but the nodejs-mobile + Gradle chain is heavy and the
# first CI runs may need tuning (SDK levels, NDK, gradle memory).
#
# Runs automatically on v* tags (alongside the desktop pipeline) AND on demand.
# It is its OWN workflow, so if this experimental build hiccups it shows a red
# mark on this run only — it never blocks or fails the desktop release.
# Produces an UNSIGNED debug APK (no Play Store signing required); on a tag the
# APK is attached to the same draft GitHub Release as the desktop installers.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write          # attach the APK to the release on tag builds

jobs:
  apk:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle + mirror standalone into nodejs-project
        run: npm run mobile:build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          MOBILE_SKIP_NEXT_BUILD: '0'

      - name: Capacitor sync (android)
        run: npx cap sync android

      # nodejs-mobile-cordova (a Cordova plugin) requires the node app at
      # android/app/src/main/assets/www/nodejs-project/. Capacitor only creates
      # assets/public, never www — so we stage it here, AFTER cap sync (which
      # manages assets/public) and BEFORE gradle. Without this the build fails
      # with "nodejs-mobile-cordova couldn't find the www folder".
      - name: Stage nodejs-project into Android assets (www)
        run: npm run mobile:stage-node

      - name: Gradle assembleDebug
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: drais-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Attach APK to the draft release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
