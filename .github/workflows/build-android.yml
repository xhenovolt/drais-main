name: Build Android (debug APK)

# EXPERIMENTAL. DRAIS Android = Capacitor + nodejs-mobile (a real Node runtime
# inside the APK running the Next standalone server on 127.0.0.1:3210). The base
# exists in-repo (android/, capacitor.config.ts, scripts/build-mobile.mjs), so
# this is a genuine build — but the nodejs-mobile + Gradle chain is heavy and the
# first CI runs may need tuning (SDK levels, NDK, gradle memory).
#
# Manual trigger ONLY, so it never gates the desktop release pipeline.
# Produces an UNSIGNED debug APK (no Play Store signing required).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle + mirror standalone into nodejs-project
        run: npm run mobile:build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          MOBILE_SKIP_NEXT_BUILD: '0'

      - name: Capacitor sync (android)
        run: npx cap sync android

      - name: Gradle assembleDebug
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: drais-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
