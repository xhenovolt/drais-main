name: Build Android (debug APK)

# EXPERIMENTAL. DRAIS Android = Capacitor + nodejs-mobile (a real Node runtime
# inside the APK running the Next standalone server on 127.0.0.1:3210). The base
# exists in-repo (android/, capacitor.config.ts, scripts/build-mobile.mjs), so
# this is a genuine build — but the nodejs-mobile + Gradle chain is heavy and the
# first CI runs may need tuning (SDK levels, NDK, gradle memory).
#
# Runs automatically on v* tags (alongside the desktop pipeline) AND on demand.
# It is its OWN workflow, so if this experimental build hiccups it shows a red
# mark on this run only — it never blocks or fails the desktop release.
# Produces an UNSIGNED debug APK (no Play Store signing required); on a tag the
# APK is attached to the same draft GitHub Release as the desktop installers.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      stability:
        description: 'APK stability channel (filename suffix)'
        type: choice
        options: [beta, alpha, lts]
        default: beta

permissions:
  contents: write          # attach the APK to the release on tag builds

jobs:
  apk:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # Capacitor 8 compiles its Android libraries against Java 21
      # (capacitor/build.gradle sets source/targetCompatibility VERSION_21),
      # so the runner MUST use JDK 21 — JDK 17 fails with
      # "error: invalid source release: 21".
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # nodejs-mobile-cordova has an UNCONDITIONAL externalNativeBuild (CMake)
      # that builds its JNI bridge to the prebuilt libnode.so, so every APK build
      # needs the NDK + CMake. The runner image does NOT ship them, so install
      # them explicitly (pinned to what AGP 8.13 expects) instead of relying on
      # gradle to auto-download mid-build — which is slow and can fail on license
      # prompts. Versions match android/app/build.gradle's ndkVersion.
      - name: Install Android NDK + CMake
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Install dependencies
        run: npm ci

      # The APK bundles its DB config the same way the desktop build does:
      # build/.env.production (gitignored) is copied into the node project by
      # scripts/build-mobile.mjs and loaded by main.js at boot. In CI that
      # file comes from the DRAIS_MOBILE_ENV repository secret — set it to
      # the full env-file content (TIDB_HOST/TIDB_USER/TIDB_PASSWORD/TIDB_DB,
      # DATABASE_MODE=tidb, DRAIS_DB_MODE=online). Without it the APK still
      # builds and boots, but has no database credentials.
      - name: Bundle DB config from secret
        env:
          DRAIS_MOBILE_ENV: ${{ secrets.DRAIS_MOBILE_ENV }}
        run: |
          if [ -n "$DRAIS_MOBILE_ENV" ]; then
            mkdir -p build
            printf '%s\n' "$DRAIS_MOBILE_ENV" > build/.env.production
            echo "Bundled DB config written ($(wc -l < build/.env.production) lines)."
          else
            echo "::warning::DRAIS_MOBILE_ENV secret not set — the APK will ship without DB credentials."
          fi

      - name: Build web bundle + mirror standalone into nodejs-project
        run: npm run mobile:build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          MOBILE_SKIP_NEXT_BUILD: '0'

      - name: Capacitor sync (android)
        run: npx cap sync android

      # nodejs-mobile-cordova (a Cordova plugin) requires the node app at
      # android/app/src/main/assets/www/nodejs-project/. Capacitor only creates
      # assets/public, never www — so we stage it here, AFTER cap sync (which
      # manages assets/public) and BEFORE gradle. Without this the build fails
      # with "nodejs-mobile-cordova couldn't find the www folder".
      - name: Stage nodejs-project into Android assets (www)
        run: npm run mobile:stage-node

      # APK is named drais-<version>-<stability>.apk by android/app/build.gradle
      # (version from package.json). Tag builds default to lts; manual runs
      # pick the channel via the workflow input (default beta).
      - name: Gradle assembleDebug
        run: |
          cd android
          chmod +x ./gradlew
          STABILITY="${{ github.event.inputs.stability }}"
          if [ -z "$STABILITY" ] && [[ "${{ github.ref }}" == refs/tags/v* ]]; then STABILITY=lts; fi
          ./gradlew assembleDebug --stacktrace ${STABILITY:+-PdraisStability=$STABILITY}

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: drais-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Attach APK to the draft release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
