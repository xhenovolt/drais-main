name: Release All Platforms

# One entry point for distributable builds. A v* tag builds every currently
# supported artifact family and attaches the results to one draft release.
# iOS is intentionally absent: this repository has no ios/ Capacitor project.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    name: Desktop (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            flags: --win --x64
          - os: ubuntu-latest
            platform: linux-x64
            flags: --linux AppImage deb
          - os: macos-13
            platform: macos-x64
            flags: --mac --x64
          - os: macos-14
            platform: macos-arm64
            flags: --mac --arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next standalone bundle
        run: npm run build:electron
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Package Electron artifacts
        run: npx electron-builder ${{ matrix.flags }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: drais-${{ matrix.platform }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK and CMake
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Install dependencies
        run: npm ci

      - name: Build and stage mobile bundle
        run: npm run mobile:build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Stage embedded Node project
        run: npm run mobile:stage-node

      - name: Assemble debug APK
        shell: bash
        run: |
          cd android
          chmod +x ./gradlew
          stability=beta
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then stability=lts; fi
          ./gradlew assembleDebug --stacktrace -PdraisStability="$stability"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: drais-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create draft GitHub Release
    needs: [desktop, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
