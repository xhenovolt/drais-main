# electron-builder configuration for DRAIS Windows packaging.
#
# Produces two Windows artefacts:
#   1. NSIS installer (.exe) — installs into Program Files, creates Start
#      Menu + desktop shortcuts.
#   2. Portable (.exe)       — self-contained, runs without install. Useful
#      for running off a USB stick during pilot deployments.
#
# Run on the Windows build machine after:
#   npm install
#   npm run build:electron
#   npm run dist:win

appId: ug.drais.desktop
productName: DRAIS
copyright: Copyright © ${author}

directories:
  output: dist
  buildResources: build

# The Next standalone bundle (under .next/standalone) is the actual
# application. Everything outside that is build tooling we deliberately
# exclude to keep the installer small.
files:
  - electron/**/*
  - package.json

extraResources:
  # The whole standalone tree (server.js + .next + public + node_modules)
  # is shipped as an extraResource — at runtime electron/main.cjs
  # require()s standalone/server.js from process.resourcesPath.
  - from: .next/standalone
    to: standalone
    filter:
      - "**/*"
      # Drop only the non-runtime relay/backup directories. (Do NOT blanket-
      # exclude *.dll/*.dylib/*.node — those can be legitimate native files
      # inside node_modules; stripping them breaks the bundle. Code-signing is
      # already disabled via win.signAndEditExecutable=false, so stray .exe no
      # longer trigger the winCodeSign download.)
      - "!**/backup/**"
      - "!**/BACKUP/**"
      - "!**/RELAY-INSTALLERS/**"
      - "!**/workers/dist/**"
  # Ship the runtime icon next to standalone/ so the BrowserWindow can
  # set its taskbar icon without depending on the asar layout. The
  # installer/shortcut icon is wired separately via `win.icon` below.
  # If build/icon.ico is missing, this entry copies nothing (no build
  # failure) and main.cjs gracefully falls back to no window icon.
  - from: build
    to: .
    filter:
      - "icon.ico"
  # Optional bundled default config. If build/.env.production exists on the
  # build machine (gitignored — never commit real secrets), it ships to
  # resources/.env.production and electron/config.cjs loads it at startup.
  # If absent, nothing is copied and the app falls back to userData/drais.env
  # or system env, showing the diagnostic screen until configured.
  - from: build
    to: .
    filter:
      - ".env.production"

# Native deps: DRAIS uses bcryptjs (pure JS), mysql2 (pure JS),
# formidable (pure JS), node-zklib (pure JS). There are NO native modules,
# so skip the @electron/rebuild / node-gyp step entirely — this means the
# Windows/macOS/Linux build machine does NOT need Python or Visual Studio
# build tools. If a native dep is ever added, set npmRebuild: true +
# asarUnpack for it and install the platform toolchain.
npmRebuild: false
nodeGypRebuild: false
buildDependenciesFromSource: false
asar: true
asarUnpack: []

win:
  # DRAIS ships unsigned (no code-signing certificate). Disabling sign+edit
  # stops electron-builder from downloading/extracting winCodeSign — whose
  # bundled macOS symlinks cannot be created on Windows without Developer Mode
  # or admin, which previously aborted the build. The installer/shortcut icon
  # still comes from `win.icon` below.
  signAndEditExecutable: false
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  artifactName: ${productName}-${version}-${arch}-${os}.${ext}
  # Add an icon at build/icon.ico (256x256) for branded shortcuts.
  # If absent, electron-builder falls back to the default Electron icon.
  icon: build/icon.ico

# Linux: AppImage (portable, runs anywhere) + deb. Build on Linux:
#   npm run build:electron && npx electron-builder --linux
linux:
  target:
    - AppImage
    - deb
  category: Education
  artifactName: ${productName}-${version}-${arch}.${ext}
  # Linux uses a PNG (>=512x512); .ico is ignored. maintainer is required by .deb.
  icon: build/icon.png
  maintainer: DRAIS <ops@drais.ug>
  synopsis: Academic, attendance & biometric platform for schools
  desktop:
    StartupWMClass: DRAIS

# Snap: opt-in (needs snapcraft on the build machine) — see `npm run dist:snap`.
# STRICT confinement → the Snap Store publishes WITHOUT a manual review, so
# `sudo snap install drais` goes live worldwide immediately. Audit confirmed
# everything DRAIS needs is covered by electron-builder's default plugs:
#   - network    → online TiDB, local MySQL (localhost), ZK devices (TCP/relay),
#                  Africa's Talking, Cloudinary
#   - home       → Excel import / photo upload / receipt + PDF downloads
#   - desktop/x11/wayland/opengl/audio → the Electron window itself
# Not needed: raw USB/serial (device access is over the network/relay) or
# child_process (none). Server-side Puppeteer PDFs don't run in any packaged
# build anyway (Chromium isn't bundled) — unaffected by this choice.
snap:
  grade: stable
  confinement: strict

# macOS: dmg + zip. Build on macOS (codesigning/notarization separate):
#   npm run build:electron && npx electron-builder --mac
mac:
  target:
    - dmg
    - zip
  category: public.app-category.education
  artifactName: ${productName}-${version}-${arch}.${ext}
  icon: build/icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DRAIS
  # The installer offers a "Run DRAIS" tick on the final page.
  runAfterFinish: true
  # Show the Xhenvolt Software License Agreement on the page after the
  # welcome screen. NSIS renders the file in a scrollable text box with
  # "I Agree / I Disagree" radio buttons; the Next button stays disabled
  # until the user selects "I Agree". A user who selects "I Disagree"
  # cannot proceed with installation.
  license: build/license.txt

portable:
  artifactName: ${productName}-${version}-portable.${ext}

# Disable auto-update for now (no update server). When ready, switch
# `publish` to an S3/GitHub Releases provider and electron-updater.
publish: null
