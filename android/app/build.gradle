apply plugin: 'com.android.application'

// DRAIS version comes from the repo's package.json so the APK always
// matches the web/desktop release. versionCode is derived from it
// (major*1_000_000 + minor*10_000 + patch) for monotonic Play ordering.
def packageJson = new groovy.json.JsonSlurper().parse(file('../../package.json'))
def draisVersion = packageJson.version
def (vMaj, vMin, vPat) = draisVersion.tokenize('.').collect { it.toInteger() }
def draisVersionCode = vMaj * 1000000 + vMin * 10000 + vPat
// Stability channel for the APK filename: -PdraisStability=alpha|beta|lts
// (default: beta for debug builds, lts for release builds).
def draisStability = project.hasProperty('draisStability') ? project.property('draisStability') : null

android {
    namespace = "ug.drais.mobile"
    compileSdk = rootProject.ext.compileSdkVersion
    // Pin the NDK the nodejs-mobile-cordova CMake bridge needs (AGP 8.13 default).
    // The CI workflow installs this exact version + CMake 3.22.1 so the build
    // never depends on gradle silently auto-downloading them on the runner.
    ndkVersion = "27.0.12077973"
    defaultConfig {
        applicationId "ug.drais.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode draisVersionCode
        versionName draisVersion
        // Node 18 mobile prebuilts (nodejs-mobile-react-native) ship no x86
        // slice; set filters EARLY so AGP never configures an x86 CMake
        // variant (the plugin gradle's late default happens post-config).
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'
        }
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    // Name the APK drais-<version>-<stability>.apk instead of app-debug.apk.
    // Stability: -PdraisStability=alpha|beta|lts; defaults to beta (debug)
    // and lts (release).
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def channel = draisStability ?: (variant.buildType.name == 'release' ? 'lts' : 'beta')
            outputFileName = "drais-${draisVersion}-${channel}.apk"
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
