// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// AGP 8 turned OFF BuildConfig generation by default. nodejs-mobile-cordova's
// NodeJS.java references BuildConfig.DEBUG, so its module fails to compile with
// "cannot find symbol: variable BuildConfig". Re-enable buildConfig for every
// Android module. This lives in the committed root build.gradle because the
// plugin's own build.gradle + Java are regenerated by `cap sync` and would lose
// any edit made there.
subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                buildFeatures {
                    buildConfig = true
                }
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
