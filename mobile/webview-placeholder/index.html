<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>DRAIS — Starting…</title>
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0f172a;
        color: #e2e8f0;
        font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        text-align: center;
        padding: 24px;
      }
      .logo {
        width: 112px;
        height: 112px;
        border-radius: 24px;
        object-fit: contain;
        background: #ffffff;
        padding: 10px;
        box-sizing: border-box;
        box-shadow: 0 18px 48px rgba(99, 102, 241, 0.35);
      }
      .title { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
      .subtitle { font-size: 13px; color: #94a3b8; max-width: 280px; line-height: 1.5; }
      .spinner {
        width: 36px;
        height: 36px;
        border: 3px solid rgba(148, 163, 184, 0.25);
        border-top-color: #818cf8;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      #status { font-size: 12px; color: #64748b; min-height: 16px; }
    </style>
  </head>
  <body>
    <img class="logo" src="./logo.png" alt="DRAIS" />
    <div class="title">Starting DRAIS</div>
    <div class="spinner"></div>
    <div class="subtitle">Booting the embedded server. This usually takes a few seconds on first launch.</div>
    <div id="status"></div>
    <script>
      // ── Boot sequence ──────────────────────────────────────────────
      // 1. Wait for the Cordova bridge (Capacitor injects it into pages
      //    served from its local server; the `nodejs` global comes from
      //    nodejs-mobile-cordova's js-module clobber).
      // 2. Call nodejs.start('main.js') exactly once — this is the ONLY
      //    thing that boots the embedded Node runtime. Nothing starts it
      //    natively; skipping this call is why the app used to die with
      //    ERR_CONNECTION_REFUSED at http://127.0.0.1:3210.
      // 3. Poll the embedded Next server; navigate once it answers.
      var SERVER = 'http://127.0.0.1:3210/';
      var statusEl = document.getElementById('status');
      var started = false;

      function setStatus(msg) { statusEl.textContent = msg; }

      function startNode() {
        if (started) return;
        if (window.nodejs && typeof window.nodejs.start === 'function') {
          started = true;
          setStatus('Starting embedded server…');
          try {
            window.nodejs.start('main.js', function (err) {
              if (err) setStatus('Node start error: ' + err);
              else setStatus('Server booting…');
            });
          } catch (e) {
            started = false;
            setStatus('Bridge not ready, retrying…');
          }
        }
      }

      // The bridge may appear before or after deviceready — cover both.
      document.addEventListener('deviceready', startNode, false);
      var bridgeWait = setInterval(function () {
        if (started) { clearInterval(bridgeWait); return; }
        startNode();
      }, 250);

      (function poll() {
        fetch(SERVER, { cache: 'no-store' })
          .then(function (res) {
            if (res.ok) { location.replace(SERVER); return; }
            setTimeout(poll, 1000);
          })
          .catch(function () { setTimeout(poll, 1000); });
      })();
    </script>
  </body>
</html>
