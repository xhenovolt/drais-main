<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>DRAIS — Starting…</title>
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0f172a;
        color: #e2e8f0;
        font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        text-align: center;
        padding: 24px;
      }
      .logo {
        width: 96px;
        height: 96px;
        border-radius: 24px;
        background: linear-gradient(135deg, #6366f1, #8b5cf6);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 36px;
        font-weight: 700;
        color: white;
        box-shadow: 0 18px 48px rgba(99, 102, 241, 0.35);
      }
      .title { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
      .subtitle { font-size: 13px; color: #94a3b8; max-width: 280px; line-height: 1.5; }
      .spinner {
        width: 36px;
        height: 36px;
        border: 3px solid rgba(148, 163, 184, 0.25);
        border-top-color: #818cf8;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="logo">D</div>
    <div class="title">Starting DRAIS</div>
    <div class="spinner"></div>
    <div class="subtitle">Booting the embedded server. This usually takes a few seconds on first launch.</div>
    <script>
      // Capacitor swaps this view out for http://127.0.0.1:3210 as
      // soon as the embedded Node server is reachable. If for some
      // reason the swap doesn't happen, poll the server and reload
      // the page when it comes up — defends against a Capacitor race
      // on cold boot.
      (function poll() {
        fetch('http://127.0.0.1:3210/')
          .then((res) => { if (res.ok) location.href = 'http://127.0.0.1:3210/'; })
          .catch(() => {})
          .finally(() => setTimeout(poll, 1000));
      })();
    </script>
  </body>
</html>
